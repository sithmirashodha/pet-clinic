<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5" style="max-width:500px">
<h2>Update Clinic</h2>
<form th:action="@{/admin/clinics/{id}/update(id=${clinic.id})}" method="post">
    <input class="form-control mb-2" name="name" th:value="${clinic.name}" required>
    <input class="form-control mb-2" name="address" th:value="${clinic.address}" required>
    <input class="form-control mb-3" name="phone" th:value="${clinic.phone}" required>
    <button class="btn btn-primary w-100">Save</button>
</form>
<a href="/admin/home">Back</a>
</body>
</html>
