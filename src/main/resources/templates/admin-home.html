<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<div class="d-flex justify-content-between">
    <h2>Admin Dashboard</h2>
    <form th:action="@{/logout}" method="post">
        <button class="btn btn-outline-secondary">Logout</button>
    </form>
</div>

<h4 class="mt-4">Pending Clinic Requests</h4>
<table class="table table-bordered">
    <tr><th>Name</th><th>Address</th><th>Phone</th><th>Action</th></tr>
    <tr th:each="c : ${pending}">
        <td th:text="${c.name}"></td>
        <td th:text="${c.address}"></td>
        <td th:text="${c.phone}"></td>
        <td>
            <form th:action="@{/admin/clinics/{id}/approve(id=${c.id})}" method="post" class="d-inline">
                <button class="btn btn-success btn-sm">Approve</button>
            </form>
            <form th:action="@{/admin/clinics/{id}/reject(id=${c.id})}" method="post" class="d-inline">
                <button class="btn btn-danger btn-sm">Reject</button>
            </form>
        </td>
    </tr>
</table>

<h4 class="mt-4">Approved Clinics</h4>
<table class="table table-bordered">
    <tr><th>Name</th><th>Address</th><th>Phone</th><th>Action</th></tr>
    <tr th:each="c : ${approved}">
        <td th:text="${c.name}"></td>
        <td th:text="${c.address}"></td>
        <td th:text="${c.phone}"></td>
        <td>
            <a class="btn btn-primary btn-sm" th:href="@{/admin/clinics/{id}/edit(id=${c.id})}">Update</a>
            <form th:action="@{/admin/clinics/{id}/delete(id=${c.id})}" method="post" class="d-inline"
                  onsubmit="return confirm('Delete this clinic?')">
                <button class="btn btn-danger btn-sm">Delete</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
