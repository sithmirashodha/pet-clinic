<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Clinic Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5" style="max-width:500px">
<h2>Clinic Registration Request</h2>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<form th:action="@{/register/clinic}" method="post">
    <input class="form-control mb-2" name="name" placeholder="Clinic name" required>
    <input class="form-control mb-2" name="address" placeholder="Address" required>
    <input class="form-control mb-2" name="phone" placeholder="Phone" required>
    <input class="form-control mb-2" type="email" name="email" placeholder="Email" required>
    <input class="form-control mb-3" type="password" name="password" placeholder="Password" required>
    <button class="btn btn-primary w-100">Send Request</button>
</form>
<a href="/">Back</a>
</body>
</html>
