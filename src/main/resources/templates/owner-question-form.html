<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ask a Question</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5" style="max-width:600px">
<h2>Ask a Question</h2>
<form th:action="@{/owner/questions}" method="post">
    <input class="form-control mb-2" name="title" placeholder="Title" required>
    <select class="form-select mb-2" name="category">
        <option value="VACCINE">Vaccine</option>
        <option value="DISEASE">Disease</option>
        <option value="FOOD">Pet food</option>
        <option value="OTHER">Other</option>
    </select>
    <textarea class="form-control mb-3" name="description" rows="5" placeholder="Describe the symptoms or your question" required></textarea>
    <button class="btn btn-primary w-100">Post Question</button>
</form>
<a href="/owner/home">Back</a>
</body>
</html>
