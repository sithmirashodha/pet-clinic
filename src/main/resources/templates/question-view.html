<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Question</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4" style="max-width:800px">
<a th:href="${backUrl}">&larr; Back</a>
<h3 class="mt-3" th:text="${question.title}"></h3>
<span class="badge bg-secondary" th:text="${question.category}"></span>
<p class="mt-3" th:text="${question.description}"></p>

<h5 class="mt-4">Answers</h5>
<div th:if="${#lists.isEmpty(comments)}" class="text-muted">No answers yet.</div>
<div class="card mb-2" th:each="c : ${comments}">
    <div class="card-body">
        <strong th:text="${c.clinic.name}"></strong>
        <p class="mb-0" th:text="${c.text}"></p>
    </div>
</div>

<form th:if="${canComment}" th:action="@{/clinic/questions/{id}/comments(id=${question.id})}" method="post" class="mt-3">
    <textarea class="form-control mb-2" name="text" rows="3" placeholder="Write your answer" required></textarea>
    <button class="btn btn-primary">Comment</button>
</form>
</body>
</html>
