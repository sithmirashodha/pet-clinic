<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Questions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<div class="d-flex justify-content-between">
    <h2>My Questions</h2>
    <form th:action="@{/logout}" method="post">
        <button class="btn btn-outline-secondary">Logout</button>
    </form>
</div>
<a class="btn btn-primary my-3" href="/owner/questions/new">Ask a Question</a>
<table class="table table-bordered">
    <tr><th>Title</th><th>Category</th><th>Date</th><th></th></tr>
    <tr th:each="q : ${questions}">
        <td th:text="${q.title}"></td>
        <td th:text="${q.category}"></td>
        <td th:text="${#temporals.format(q.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td><a class="btn btn-sm btn-info" th:href="@{/owner/questions/{id}(id=${q.id})}">View answers</a></td>
    </tr>
</table>
</body>
</html>
